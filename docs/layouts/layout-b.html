<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案二：沉浸悬浮版 (Immersive Creator)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a1a1a; }
        .glass-pill { background: rgba(30, 30, 30, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .glass-panel { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); }
        /* 侧边栏 Hover 展开效果 */
        .hover-expand { width: 3.5rem; overflow: hidden; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-expand:hover { width: 14rem; }
        .icon-btn { display: flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: 9999px; transition: all 0.2s; color: #a1a1aa; }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-gray-200 font-sans relative select-none">
    
    <!-- 全屏 3D 舞台 -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <label class="px-6 py-3 border-2 border-white/10 rounded-full text-white/30 text-xl tracking-widest uppercase">Canvas Area (3D Viewport)</label>
    </div>

    <!-- 顶部布局区：悬浮药丸形态 -->
    <div class="absolute top-6 left-6 right-6 flex justify-between pointer-events-none z-20">
        <!-- 左上角 -->
        <div class="glass-pill rounded-full p-1.5 flex gap-1 pointer-events-auto h-12 shadow-lg">
            <button class="icon-btn">三</button>
            <div class="flex items-center px-3 text-sm font-medium border-l border-white/10 ml-1 pl-4">Scene 01</div>
        </div>

        <!-- 中间上面：视角控制器 -->
        <div class="glass-pill rounded-full p-1.5 flex items-center gap-1 pointer-events-auto h-12 shadow-xl shadow-black/20">
            <button class="px-4 h-full rounded-full bg-white text-black text-xs font-bold leading-none">Render Cam</button>
            <button class="px-4 h-full rounded-full text-gray-400 hover:text-white text-xs font-medium leading-none">Perspective</button>
            <div class="w-px h-5 bg-white/10 mx-2"></div>
            <button class="icon-btn text-xs px-2 w-auto" title="网格/线框">线框模式</button>
        </div>

        <!-- 右上角：功能操作区 -->
        <div class="glass-pill rounded-full p-1.5 flex gap-1 pointer-events-auto h-12 shadow-lg">
            <button class="icon-btn text-sm" title="Undo">↶</button>
            <button class="icon-btn text-sm" title="Redo">↷</button>
            <div class="w-px h-6 my-auto bg-white/10 mx-1"></div>
            <button class="icon-btn text-sm" title="截图">📷</button>
            <button class="ml-1 px-5 h-full rounded-full bg-blue-500 hover:bg-blue-400 text-white text-xs font-bold tracking-wide transition shadow-lg shadow-blue-500/30">▷ 预览播放</button>
        </div>
    </div>

    <!-- 左侧靠边：悬浮工具条 (Hover 展开为资产库) -->
    <div class="absolute left-6 top-1/2 -translate-y-1/2 glass-panel rounded-2xl hover-expand h-auto max-h-[70vh] flex flex-col p-2 z-20 pointer-events-auto shadow-2xl">
        <div class="flex items-center w-[13rem] h-10 mb-2 cursor-pointer hover:bg-white/5 rounded-lg">
            <div class="w-10 flex justify-center shrink-0 text-lg">📁</div>
            <span class="text-sm font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity delay-100">大纲树 (Outline)</span>
        </div>
        <div class="flex items-center w-[13rem] h-10 mb-2 cursor-pointer hover:bg-white/5 rounded-lg">
            <div class="w-10 flex justify-center shrink-0 text-lg">💡</div>
            <span class="text-sm font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity delay-100">添加灯光 (Lights)</span>
        </div>
        <div class="flex items-center w-[13rem] h-10 mb-2 cursor-pointer hover:bg-white/5 rounded-lg">
            <div class="w-10 flex justify-center shrink-0 text-lg">🎥</div>
            <span class="text-sm font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity delay-100">添加机位 (Cameras)</span>
        </div>
        <div class="flex items-center w-[13rem] h-10 mb-2 bg-white/10 rounded-lg cursor-pointer">
            <div class="w-10 flex justify-center shrink-0 text-lg">🧍</div>
            <span class="text-sm font-medium whitespace-nowrap">导入模型 (Models)</span>
        </div>
        <div class="flex items-center w-[13rem] h-10 mb-2 cursor-pointer hover:bg-white/5 rounded-lg">
            <div class="w-10 flex justify-center shrink-0 text-lg">🏃</div>
            <span class="text-sm font-medium whitespace-nowrap">动作库 (Motions)</span>
        </div>
    </div>

    <!-- 右侧靠边：自动折叠的属性面板 (仅选中时显示) -->
    <div class="absolute right-6 top-28 w-64 glass-panel rounded-2xl p-4 z-20 pointer-events-auto">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-sm font-bold flex items-center gap-2"><span>🧍</span> 角色_01</h3>
            <button class="text-gray-500 hover:text-white">✕</button>
        </div>
        <div class="space-y-4">
            <div class="bg-black/20 rounded-lg p-3 border border-white/5">
                <p class="text-xs text-gray-400 mb-2">当前动作片段</p>
                <div class="flex justify-between items-center">
                    <span class="text-sm text-blue-400">Idle_Breathing</span>
                    <button class="text-xs px-2 py-1 bg-white/10 rounded">替换</button>
                </div>
            </div>
            <div>
                <p class="text-xs text-gray-400 mb-2">坐标系统 (Transform)</p>
                <div class="grid grid-cols-1 gap-1">
                    <div class="flex bg-black/20 rounded border border-white/5 overflow-hidden">
                        <span class="bg-white/5 px-2 py-1 text-xs text-gray-500 w-12 text-center">X</span>
                        <input type="text" value="0.00" class="bg-transparent w-full px-2 text-sm text-center outline-none">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部靠边：迷你时间线 (点击向上推拉展开高级轨迹面板) -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-2/3 max-w-2xl glass-panel rounded-2xl p-2 flex items-center gap-4 z-20 pointer-events-auto shadow-2xl">
        <button class="w-10 h-10 shrink-0 bg-white text-black rounded-full flex items-center justify-center pl-1 text-lg">▶</button>
        
        <!-- 一条轨道同时反映机位与动作关键节点 -->
        <div class="flex-1 relative h-6 bg-black/30 rounded-lg cursor-pointer overflow-hidden border border-white/5">
            <!-- 波形或关键帧缩略图 -->
            <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')]"></div>
            <!-- Indicator -->
            <div class="absolute top-0 bottom-0 left-[42%] w-px bg-red-400 shadow-[0_0_8px_#f87171]"></div>
            <div class="absolute top-1 left-[30%] w-2 h-2 rotate-45 bg-amber-400 rounded-sm"></div>
            <div class="absolute top-1 left-[60%] w-2 h-2 rotate-45 bg-amber-400 rounded-sm"></div>
            <div class="absolute top-3 left-[20%] right-[30%] h-1.5 bg-blue-500/50 rounded-full"></div>
        </div>
        
        <span class="text-sm font-mono shrink-0 w-16 text-center">00:02:14</span>
        <div class="w-px h-6 bg-white/10"></div>
        <button class="px-3 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg flex items-center gap-1">
            <span>📈</span> 展开详情序列
        </button>
    </div>
</body>
</html>
