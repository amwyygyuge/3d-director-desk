<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Director Desk - UI Layout Proposals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f1013; }</style>
</head>
<body class="text-gray-200 font-sans p-8 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 mt-4">3D Director Desk - UI Layout Proposals</h1>
    
    <div class="grid grid-cols-1 gap-6">
        <a href="layout-a.html" class="block p-5 bg-white/5 rounded-xl border border-white/10 hover:bg-white/10 transition">
            <h2 class="text-xl font-semibold mb-2 text-blue-400">方案 A：经典控制台</h2>
            <p class="text-gray-400 text-sm">类似传统 3D 软件，界面四周固定面板。适合需要一直盯着结构和属性的用户。</p>
        </a>
        
        <a href="layout-b.html" class="block p-5 bg-white/5 rounded-xl border border-white/10 hover:bg-white/10 transition">
            <h2 class="text-xl font-semibold mb-2 text-indigo-400">方案 B：沉浸悬浮版</h2>
            <p class="text-gray-400 text-sm">面板默认缩起呈药丸状/小图标。画布空间最大化。</p>
        </a>
        
        <a href="layout-c.html" class="block p-5 bg-white/5 rounded-xl border border-white/10 hover:bg-white/10 transition">
            <h2 class="text-xl font-semibold mb-2 text-amber-400">方案 C：导演工作流版 (原推荐)</h2>
            <p class="text-gray-400 text-sm">专业的高级全宽时间线占据底部，左右属性面板独立悬浮，无底色顶部工具栏。</p>
        </a>

        <a href="layout-d.html" class="block p-5 bg-indigo-900/30 rounded-xl border border-indigo-500/50 hover:bg-indigo-900/50 transition">
            <h2 class="text-xl font-semibold mb-2 text-white">方案 D：综合悬浮工作流版 (最新) 🔥</h2>
            <p class="text-gray-400 text-sm">融合了 B 的隐匿感与 C 的专业工作流。左侧 Hover 展开大纲/资产，底部时间线鼠标悬浮拉起（默认只是一条极简播放器），中间保持极限大视野。</p>
        </a>
    </div>
</body>
</html>
