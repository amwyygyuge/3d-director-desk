<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案D：综合悬浮工作流 (Mixed Immersive Workflow)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a1a1c; }
        .glass-pill { background: rgba(30, 31, 34, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
        .glass-panel { background: rgba(22, 23, 26, 0.7); backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,0.08); }
        
        /* 侧边栏 Hover 展开效果 (资产栏) */
        .hover-expand { width: 3.5rem; overflow: hidden; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-expand:hover { width: 15rem; }
        
        /* 底栏面板推拉动画用 */
        .timeline-expand { height: 3.5rem; transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .timeline-expand:hover { height: 16rem; }

        .icon-btn { display: flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: 9999px; transition: all 0.2s; color: #a1a1aa; }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        
        /* 时间线上的轨道背景 */
        .track-bg { background: repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(255,255,255,0.03) 20px); }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-gray-200 font-sans relative select-none">
    
    <!-- 全屏 3D 舞台 (占据所有空间) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none text-white/5 font-extrabold text-5xl uppercase tracking-widest z-0">
        3D Viewport
    </div>

    <!-- 顶部布局区：悬浮药丸形态保持清爽 -->
    <div class="absolute top-4 left-6 right-6 flex justify-between pointer-events-none z-20">
        <!-- 左上角: 类似工作流版的紧凑项目信息 -->
        <div class="glass-pill rounded-full p-1.5 flex gap-1 pointer-events-auto h-12 shadow-lg">
            <button class="icon-btn">三</button>
            <div class="flex items-center px-3 text-sm font-bold tracking-wide border-l border-white/10 ml-1 pl-4">3D Director Desk</div>
        </div>

        <!-- 中间上面：视角控制器 (透明工具栏) -->
        <div class="glass-pill rounded-full p-1.5 flex items-center gap-1 pointer-events-auto h-12 shadow-xl shadow-black/20">
            <button class="px-4 h-full rounded-full bg-indigo-500 text-white text-xs font-bold leading-none shadow-[0_0_15px_rgba(99,102,241,0.4)]">🎬 导演视图</button>
            <button class="px-4 h-full rounded-full text-gray-400 hover:text-white text-xs font-medium leading-none">🕹️ 漫游</button>
            <div class="w-px h-5 bg-white/10 mx-2"></div>
            <button class="icon-btn text-xs px-2 w-auto" title="网格">🌐 线框</button>
        </div>

        <!-- 右上角：Undo/Redo & 输出 -->
        <div class="glass-pill rounded-full p-1.5 flex gap-1 pointer-events-auto h-12 shadow-lg">
            <button class="icon-btn text-sm" title="Undo">↶</button>
            <button class="icon-btn text-sm" title="Redo">↷</button>
            <div class="w-px h-6 my-auto bg-white/10 mx-1"></div>
            <button class="icon-btn text-sm" title="截图">📷</button>
            <button class="ml-1 px-5 h-full rounded-full bg-white hover:bg-gray-200 text-black text-xs font-bold tracking-wide transition shadow-[0_0_15px_rgba(255,255,255,0.2)]">▶ 全屏预览</button>
        </div>
    </div>

    <!-- 左侧靠边：悬浮吸附工具条 (B方案的 Hover 展开设计，降低遮挡，加入大纲) -->
    <div class="absolute left-4 top-1/2 -translate-y-1/2 glass-panel rounded-2xl hover-expand h-auto max-h-[70vh] flex flex-col p-2 z-20 pointer-events-auto shadow-2xl border border-white/5">
        <div class="flex items-center w-[14rem] h-11 mb-1 cursor-pointer hover:bg-white/5 rounded-xl transition">
            <div class="w-10 flex justify-center shrink-0 text-lg">📁</div>
            <span class="text-sm font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">资源大纲 (Outline)</span>
        </div>
        <div class="w-8 h-px bg-white/10 mx-auto my-2 group-hover:w-[12rem] transition-all"></div>
        <div class="flex items-center w-[14rem] h-11 mb-1 cursor-pointer hover:bg-white/5 rounded-xl transition text-indigo-300">
            <div class="w-10 flex justify-center shrink-0 text-lg">🎥</div>
            <span class="text-sm font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">添加机位</span>
        </div>
        <div class="flex items-center w-[14rem] h-11 mb-1 bg-white/10 rounded-xl cursor-pointer">
            <div class="w-10 flex justify-center shrink-0 text-lg">🧍</div>
            <span class="text-sm font-medium whitespace-nowrap">导入模型资产</span>
        </div>
        <div class="flex items-center w-[14rem] h-11 mb-1 cursor-pointer hover:bg-white/5 rounded-xl transition text-gray-400">
            <div class="w-10 flex justify-center shrink-0 text-lg">💡</div>
            <span class="text-sm font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">添加灯光环境</span>
        </div>
        <div class="flex items-center w-[14rem] h-11 cursor-pointer hover:bg-white/5 rounded-xl transition text-blue-300">
            <div class="w-10 flex justify-center shrink-0 text-lg">🏃</div>
            <span class="text-sm font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">拉取动作库</span>
        </div>
    </div>

    <!-- 右侧靠边：对象属性面板 (吸取C方案的情境上下文，选中时出现) -->
    <!-- 保持一定的垂直居中，不占满屏幕，留出透气感 -->
    <div class="absolute right-4 top-24 bottom-24 w-72 glass-panel rounded-2xl p-0 z-20 pointer-events-auto flex flex-col shadow-2xl">
        <div class="p-4 border-b border-white/10 bg-black/20 rounded-t-2xl flex justify-between items-center backdrop-blur-3xl">
            <div>
                <div class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest mb-0.5">Model Selected</div>
                <h3 class="text-sm font-bold flex items-center gap-1">🧍 女主角_Sarah</h3>
            </div>
            <button class="text-gray-500 hover:text-white w-6 h-6 flex items-center justify-center bg-black/40 rounded-full">✕</button>
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto space-y-5">
            <!-- 动作卡片 -->
            <div class="bg-black/20 rounded-xl p-3 border border-white/5 shadow-inner">
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-2">Current Motion</p>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-semibold text-blue-400">Walking_Cycle</span>
                    <button class="text-[10px] px-2 py-1 bg-white/10 hover:bg-white/20 rounded">更换</button>
                </div>
            </div>
            
            <!-- 空间位置 -->
            <div>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-2">Transform</p>
                <div class="grid grid-cols-3 gap-1.5">
                    <div class="flex flex-col bg-black/20 rounded border border-white/5 overflow-hidden p-1.5">
                        <span class="text-[10px] text-gray-600 block text-center border-b border-white/5 pb-0.5">X</span>
                        <input type="text" value="1.24" class="bg-transparent w-full pt-1 text-xs text-center outline-none text-gray-300">
                    </div>
                    <div class="flex flex-col bg-black/20 rounded border border-white/5 overflow-hidden p-1.5">
                        <span class="text-[10px] text-gray-600 block text-center border-b border-white/5 pb-0.5">Y</span>
                        <input type="text" value="0.00" class="bg-transparent w-full pt-1 text-xs text-center outline-none text-gray-300">
                    </div>
                    <div class="flex flex-col bg-black/20 rounded border border-white/5 overflow-hidden p-1.5">
                        <span class="text-[10px] text-gray-600 block text-center border-b border-white/5 pb-0.5">Z</span>
                        <input type="text" value="-3.10" class="bg-transparent w-full pt-1 text-xs text-center outline-none text-gray-300">
                    </div>
                </div>
            </div>

            <!-- 参数联动提示 -->
            <div class="mt-4 p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl">
                <p class="text-[11px] text-indigo-300 leading-relaxed">
                    💡 使用底部时间线，可为该对象记录关键帧轨迹和分配动作片段。
                </p>
            </div>
        </div>
    </div>

    <!-- 底部： Hover 自动推拉的大时间线 (C方案的专业轨道结合B方案的隐形) -->
    <!-- 默认缩叠为一个播放条，鼠标悬浮或点击上方把手后拉起成高级工作流面板 -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-4/5 max-w-5xl glass-panel rounded-2xl timeline-expand flex flex-col z-30 pointer-events-auto shadow-[0_10px_50px_rgba(0,0,0,0.5)] border border-white/10 group overflow-hidden">
        
        <!-- 恒定展示的收起态/控制器 (高 3.5rem=56px) -->
        <div class="h-14 shrink-0 px-4 flex items-center gap-4 bg-black/20">
            <!-- 播放操控 -->
            <div class="flex items-center gap-2">
                <button class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-xs">⏮</button>
                <button class="w-10 h-10 rounded-full bg-white text-black hover:bg-gray-200 flex items-center justify-center pl-1 shadow-[0_0_15px_rgba(255,255,255,0.2)]">▶</button>
            </div>
            
            <div class="text-base font-mono text-indigo-400 font-bold tracking-widest w-24 text-center">00:04:15</div>
            
            <!-- 迷你预览条，展开后隐去或作为缩略功能 -->
            <div class="flex-1 relative h-6 bg-black/40 rounded overflow-hidden border border-white/5">
                <div class="absolute top-0 bottom-0 left-[35%] w-px bg-red-500 shadow-[0_0_8px_#ef4444]"></div>
                <!-- 迷你指示 -->
                <div class="absolute top-1 left-[20%] w-2 h-2 rotate-45 bg-indigo-500 rounded-sm"></div>
                <div class="absolute top-2 left-[50%] right-[30%] h-1.5 bg-blue-500/50 rounded-full"></div>
            </div>
            
            <div class="w-px h-6 bg-white/10 ml-2"></div>
            <div class="flex flex-col items-center justify-center w-8 text-gray-500 group-hover:text-white transition">
                <span class="text-[10px] uppercase font-bold tracking-widest pb-1 opacity-0 group-hover:opacity-100 transition-opacity absolute -top-4 bg-black/60 px-2 rounded">Timeline</span>
                ▲
            </div>
        </div>

        <!-- 详细轨道内容 (展开后可见) -->
        <div class="flex-1 flex overflow-hidden border-t border-white/5 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity delay-100">
            <!-- 轨道前缀 -->
            <div class="w-48 shrink-0 border-r border-white/5 flex flex-col bg-black/30">
                <div class="h-6"></div> <!-- 标尺对齐 -->
                <!-- Camera track -->
                <div class="h-14 border-b border-white/5 px-3 flex flex-col justify-center bg-indigo-900/10 border-l-2 border-l-indigo-500">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-semibold text-indigo-300">🎥 运镜轨迹</span>
                        <span class="w-3 h-3 rotate-45 border border-indigo-400 text-[8px] flex justify-center cursor-pointer hover:bg-indigo-400 bg-black"></span>
                    </div>
                </div>
                <!-- Action track -->
                <div class="h-10 border-b border-white/5 px-3 flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-400">🧍 角色动作</span>
                    <span class="text-xs text-gray-600">+</span>
                </div>
            </div>

            <!-- 时间轴网格 -->
            <div class="flex-1 bg-[#141517] relative track-bg overflow-x-hidden">
                <!-- 标尺 -->
                <div class="h-6 border-b border-white/5 relative text-[10px] text-gray-500 font-mono flex items-end pb-0.5 bg-black/20">
                    <span class="absolute left-[10%] border-l border-gray-600 pl-0.5 h-2">00:03</span>
                    <span class="absolute left-[30%] border-l border-gray-600 pl-0.5 h-2">00:04</span>
                    <span class="absolute left-[50%] border-l border-gray-600 pl-0.5 h-2">00:05</span>
                </div>
                
                <!-- Camera data -->
                <div class="h-14 border-b border-white/5 relative">
                    <div class="absolute top-[26px] left-[10%] w-[40%] h-[1px] bg-indigo-500/50"></div>
                    <div class="absolute top-[23px] left-[10%] w-2 h-2 rotate-45 bg-indigo-400 shadow-[0_0_8px_rgba(99,102,241,0.8)]"></div>
                    <div class="absolute top-[23px] left-[50%] w-2 h-2 rotate-45 bg-indigo-400 shadow-[0_0_8px_rgba(99,102,241,0.8)]"></div>
                </div>

                <!-- Action data -->
                <div class="h-10 border-b border-white/5 relative flex items-center">
                    <div class="absolute left-[30%] right-[40%] h-6 bg-blue-600/70 rounded border border-blue-400 shadow-md flex items-center px-2 z-10">
                        <span class="text-[10px] font-medium text-white truncate drop-shadow">🏃 Walk_Cycle</span>
                    </div>
                </div>

                <!-- Playhead -->
                <div class="absolute top-0 bottom-0 left-[35%] w-[1px] bg-red-500 z-20 shadow-[0_0_5px_red]">
                    <div class="absolute top-0 -translate-x-1/2 w-0 h-0 border-l-[5px] border-r-[5px] border-t-[6px] border-l-transparent border-r-transparent border-t-red-500"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
